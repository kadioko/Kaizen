services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tofauti
      POSTGRES_USER: tofauti
      POSTGRES_PASSWORD: tofauti
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["cache"]
volumes:
  postgres-data:
