[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tofauti-market-engine"
version = "0.1.0"
description = "Provider-agnostic market intelligence engine for TOFAUTI."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[tool.setuptools.packages.find]
include = ["tofauti_market_engine*"]

